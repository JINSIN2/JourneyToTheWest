<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>西遊記 榜 · 서유기 MVU 인물 소개</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<script src="data.js"></script>
<style>
:root{--paper:#f3ead6;--paper2:#fffaf0;--paper3:#e9dcc0;--ink:#2b2118;--ink2:#6b5a48;--red:#9d2932;--gold:#c5a05a;--gold2:#8b6914;--jade:#3f7a4a;--night:#1f1812}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:#e7dcc3;background-image:repeating-linear-gradient(97deg,rgba(139,105,20,.035) 0 1px,transparent 1px 7px),repeating-linear-gradient(3deg,rgba(107,90,72,.03) 0 1px,transparent 1px 11px);color:var(--ink);font-family:'Gowun Batang','Noto Serif KR',serif;font-size:16px;line-height:1.8;word-break:keep-all;overflow-wrap:break-word}
.brush{font-family:'Zhi Mang Xing','Gowun Batang',cursive;font-weight:400}
a{color:var(--red)}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 70px}
/* masthead */
.mast{text-align:center;padding:46px 18px 26px;background:linear-gradient(180deg,#241a12,#3a2a1c);color:#f3e2bd;border-bottom:4px double var(--gold)}
.mast h1{margin:0;font-size:72px;line-height:1;color:var(--gold);letter-spacing:.08em}
.mast p{margin:14px auto 0;max-width:560px;font-size:15px;opacity:.9}
.toc{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}
.toc a{color:#f3e2bd;text-decoration:none;border:1px solid rgba(197,160,90,.6);padding:3px 12px;border-radius:999px;font-size:13.5px}
.toc a:hover{background:var(--red);border-color:var(--red)}
/* group */
.grp{margin-top:44px}
.grp-h{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--gold);padding-bottom:6px;margin-bottom:6px}
.grp-h b{font-size:44px;color:var(--red);line-height:1}
.grp-h span{font-size:20px;font-weight:700}
.grp-lead{color:var(--ink2);font-size:14.5px;margin:0 0 16px}
/* folio row */
.folio{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:stretch;background:var(--paper);border:1px solid rgba(197,160,90,.75);box-shadow:3px 4px 0 rgba(139,105,20,.15);margin:0 0 16px;cursor:pointer;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.folio:hover{transform:translateY(-2px);box-shadow:4px 7px 0 rgba(139,105,20,.2)}
.folio .pic{position:relative;min-height:200px;background:var(--paper3);overflow:hidden;border-right:1px solid rgba(197,160,90,.75)}
.folio .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.folio .pic.land img{object-position:center}
.folio .pic.quad{display:grid;grid-template-columns:1fr 1fr}
.folio .pic.quad img{position:static;width:100%;height:100%;aspect-ratio:1/1}
.folio .txt{padding:16px 18px 14px 0;display:flex;flex-direction:column}
.folio h3{margin:0;font-size:26px;line-height:1.25}
.folio h3 small{font-size:14px;color:var(--ink2);font-weight:400;margin-left:8px;letter-spacing:.05em}
.folio .ttl{font-size:13.5px;color:var(--gold2)}
.folio p{margin:8px 0 10px;font-size:15px}
.folio .foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:12px;padding:1px 8px;border:1px solid var(--gold);background:#efe3c7;border-radius:3px;white-space:nowrap}
.more{margin-left:auto;font-size:13.5px;color:var(--red);font-weight:700;white-space:nowrap}
.seal{display:inline-grid;place-items:center;min-width:34px;height:28px;padding:0 6px;background:var(--red);color:#fff8ee;font-size:14px;border-radius:3px;transform:rotate(-4deg);box-shadow:0 0 0 2px var(--paper)}
.seal.top{background:#1f1612}.seal.q{background:#7a6a58}
/* reader */
.reader{position:fixed;inset:0;background:rgba(20,14,9,.72);display:none;overflow-y:auto;z-index:40;padding:22px 12px}
.reader.open{display:block}
.sheet{position:relative;max-width:900px;margin:0 auto;background:var(--paper2);background-image:repeating-linear-gradient(97deg,rgba(139,105,20,.03) 0 1px,transparent 1px 7px);box-shadow:0 20px 60px rgba(0,0,0,.5);padding:0 0 30px;animation:unroll .3s ease-out}
@keyframes unroll{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.xwrap{position:sticky;top:0;height:0;z-index:5;display:flex;justify-content:flex-end}
.x{margin:10px 10px 0 0;width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);background:rgba(243,234,214,.92);color:var(--red);font-size:18px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hero{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:26px;padding:28px 30px 10px}
.hero .art{background:var(--paper3);border:1px solid rgba(197,160,90,.75);box-shadow:4px 5px 0 rgba(139,105,20,.15);align-self:start}
.hero .art img{display:block;width:100%;height:auto}
.hero h2{margin:0;font-size:50px;line-height:1.05}
.hero .meta{color:var(--ink2);margin:8px 0 12px;font-size:14.5px}
.banner{position:relative;height:300px;overflow:hidden;background:var(--paper3)}
.banner img{width:100%;height:100%;object-fit:cover}
.banner .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 30px 16px;background:linear-gradient(0deg,rgba(20,14,9,.85),transparent);color:#fff6e0}
.banner .cap h2{margin:0;font-size:52px;line-height:1;color:#f3d79a}
.banner .cap div{font-size:14px;opacity:.9;margin-top:6px}
.body{padding:6px 30px 0}
/* sections */
.sec{border-top:1px solid rgba(197,160,90,.6);margin-top:8px}
.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 0 10px;font-size:19px;font-weight:700}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:'';width:12px;height:12px;background:var(--red);transform:rotate(45deg);flex:none}
.sec>summary::after{content:'펼치기 ▾';margin-left:auto;font-size:12px;color:var(--gold2);font-weight:400}
.sec[open]>summary::after{content:'접기 ▴'}
.sec .in{padding:0 0 14px}
.in p{margin:0 0 .8em}
.in h5{margin:14px 0 6px;font-size:16.5px;color:var(--red)}
.in h6{margin:12px 0 4px;font-size:14.5px;color:var(--gold2);letter-spacing:.03em}
.in ul{margin:4px 0 12px;padding-left:20px}.in li{margin:3px 0}
.kv{display:grid;grid-template-columns:minmax(90px,max-content) minmax(0,1fr);margin:6px 0 12px;border:1px solid rgba(197,160,90,.7);background:rgba(255,250,240,.6)}
.kv dt,.kv dd{margin:0;padding:6px 10px;border-bottom:1px dotted rgba(197,160,90,.7)}
.kv dt{background:#efe3c7;font-weight:700;font-size:14px;color:#5b4320}
.kv dd{font-size:15px}
.kv dt:last-of-type,.kv dd:last-of-type{border-bottom:0}
.says{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin:6px 0 14px}
.say{margin:0;padding:8px 12px;background:#fff;border:1px solid rgba(197,160,90,.65);border-left:3px solid var(--red);border-radius:2px 10px 10px 2px;font-size:14.5px;line-height:1.6}
.say i{display:block;font-style:normal;font-size:12px;color:var(--ink2)}
.say span::before{content:'“';color:var(--red)}.say span::after{content:'”';color:var(--red)}
.say.solo{display:block;margin:6px 0 12px}
/* people inside a land */
.people-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px;border-bottom:2px solid var(--red);padding-bottom:4px}
.people-h b{font-size:32px;color:var(--red)}
.person{border:1px solid rgba(197,160,90,.8);background:var(--paper);margin:0 0 12px}
.person>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 14px 10px 10px}
.person>summary::-webkit-details-marker{display:none}
.person .face{width:96px;height:120px;background:var(--paper3);overflow:hidden;border:1px solid rgba(197,160,90,.7);position:relative}
.person .face img{width:100%;height:100%;object-fit:cover;object-position:center top}
.person h4{margin:0;font-size:22px}
.person h4 small{font-size:13px;color:var(--ink2);font-weight:400;margin-left:6px}
.person .bl{font-size:14px;color:var(--ink2)}
.person .tog{font-size:12.5px;color:var(--red);white-space:nowrap}
.person[open] .tog::after{content:' ▴'}.person:not([open]) .tog::after{content:' ▾'}
.person .pbody{padding:0 18px 10px;border-top:1px dashed rgba(197,160,90,.8)}
.person .pbody .art{max-width:300px;margin:14px auto 4px}
.person .pbody .art img{width:100%;display:block;border:1px solid rgba(197,160,90,.7)}
/* unknown face */
.ink{position:relative;background:#2b2118!important;display:grid;place-items:center}
.ink::before{content:'';position:absolute;inset:12% 14%;background:radial-gradient(ellipse at 50% 40%,#0d0a07 0 42%,transparent 70%),repeating-linear-gradient(-35deg,rgba(0,0,0,.55) 0 5px,transparent 5px 9px);filter:blur(1px)}
.ink .st{position:relative;border:2px solid var(--red);color:var(--red);background:rgba(243,234,214,.9);font-size:12px;padding:2px 4px;transform:rotate(-8deg);letter-spacing:.08em;white-space:nowrap}
.hero .art.ink{min-height:360px}
.link-note{margin:14px 0 0;padding:10px 12px;border-left:3px solid var(--gold2);background:rgba(255,250,240,.7);font-size:14px}
/* sealed */
.sealed{margin-top:56px;padding:26px 18px;background:var(--night);color:#f3e2bd;border:1px solid rgba(197,160,90,.5)}
.sealed h2{margin:0;text-align:center;font-size:54px;color:var(--gold);line-height:1}
.sealed>p{text-align:center;margin:10px 0 20px;font-size:14px;opacity:.85}
.secrets{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.secret{position:relative;background:var(--paper);color:var(--ink);min-height:120px;padding:16px;cursor:pointer;overflow:hidden}
.secret.open{grid-column:1/-1;cursor:default}
.secret .who{font-size:12.5px;color:var(--ink2)}
.secret h3{margin:2px 0 0;font-size:20px}
.secret .text{display:none;margin-top:8px}
.secret.open .text{display:block}
.fu{position:absolute;left:50%;top:50%;width:60px;height:160%;background:#f2d873;border:1px solid #c9a93c;display:grid;place-items:center;transition:transform .55s ease-in,opacity .55s;box-shadow:0 2px 6px rgba(0,0,0,.3);z-index:2}
.fu span{font-size:32px;color:var(--red)}
.fu.a{transform:translate(-50%,-50%) rotate(35deg)}.fu.b{transform:translate(-50%,-50%) rotate(-35deg)}
.secret.open .fu.a{transform:translate(-200%,30%) rotate(80deg);opacity:0;pointer-events:none}
.secret.open .fu.b{transform:translate(100%,30%) rotate(-80deg);opacity:0;pointer-events:none}
.ask{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(43,33,24,.92);color:#fff3d6;font-size:13px;padding:6px 8px;text-align:center;display:none;z-index:3}
.secret.asking .ask{display:block}
footer{text-align:center;color:var(--ink2);font-size:13px;margin-top:40px}
@media (max-width:640px){
  .mast h1{font-size:50px}.wrap{padding:0 14px 60px}
  .reader{padding:0}.sheet{min-height:100%;box-shadow:none}
  .x{width:34px;height:34px;font-size:16px;margin:8px 8px 0 0}
  .folio{grid-template-columns:1fr;gap:0}
  .folio .pic{min-height:0;aspect-ratio:4/3;border-right:0;border-bottom:1px solid rgba(197,160,90,.75)}
  .folio .pic.portrait{aspect-ratio:1/1}
  .folio .pic.quad{aspect-ratio:auto}
  .folio .txt{padding:12px 14px}
  .folio h3{font-size:23px}
  .hero{grid-template-columns:1fr;padding:22px 16px 6px;gap:16px}
  .hero .art{max-width:320px;margin:0 auto}
  .hero h2{font-size:40px}
  .banner{height:200px}.banner .cap{padding:30px 16px 12px}.banner .cap h2{font-size:38px}
  .body{padding:6px 16px 0}
  .person>summary{grid-template-columns:64px minmax(0,1fr);gap:10px}
  .person .face{width:64px;height:80px}
  .person .tog{grid-column:2}
  .person h4{font-size:19px}
  .person .pbody{padding:0 12px 8px}
  .kv{grid-template-columns:1fr}.kv dt{border-bottom:0;padding-bottom:2px}.kv dd{padding-top:2px}
  .says{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="mast">
  <h1 class="brush">西遊記 榜</h1>
  <p>🪷 서유기 MVU — 오행산에서 서천 영산까지, 길 위에서 만나는 이들과 그들이 사는 땅</p>
  <nav class="toc" id="toc"></nav>
</header>
<main class="wrap" id="main"></main>
<div class="reader" id="reader" role="dialog" aria-modal="true"><article class="sheet" id="sheet"></article></div>
<script>
(() => {
  const $ = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sealCls = g => g === '측정불가' ? 'seal top' : /[?—]/.test(g || '—') ? 'seal q' : 'seal';
  const OPEN = /기본|외모|성격|정체성|^$|보상국|완자산|오계국|유리정|호산|화운동|차지국|뇌신대|서량|자모하|화염산|취운동|비구국|백무정|오래국|화과산|천계|33|능소/;
  const img = (src, alt, cls, eager) => { const i = new Image(); i.loading = eager ? 'eager' : 'lazy'; i.src = src; i.alt = alt || ''; if (cls) i.className = cls; i.onerror = () => i.remove(); return i; };
  const inkFace = cls => { const d = $('div', (cls || '') + ' ink'); d.append($('span', 'st brush', '人相不明')); return d; };
  const items = DATA.groups.flatMap(g => g.items);
  const byId = Object.fromEntries(items.map(i => [i.id, i]));

  // masthead toc + groups
  const toc = document.getElementById('toc'), main = document.getElementById('main');
  for (const g of DATA.groups) {
    const a = $('a', '', `${esc(g.han)} ${esc(g.ko)}`); a.href = '#grp-' + g.id; a.onclick = e => { e.preventDefault(); document.getElementById('grp-' + g.id).scrollIntoView({ behavior: 'smooth' }); }; toc.append(a);
    const sec = $('section', 'grp'); sec.id = 'grp-' + g.id;
    sec.append($('div', 'grp-h', `<b class="brush">${esc(g.han)}</b><span>${esc(g.ko)}</span>`), $('p', 'grp-lead', esc(g.lead)));
    for (const it of g.items) sec.append(folio(it));
    main.append(sec);
  }
  const sk = $('a', '', '封印 비설'); sk.href = '#sealed'; sk.onclick = e => { e.preventDefault(); document.getElementById('sealed').scrollIntoView({ behavior: 'smooth' }); }; toc.append(sk);

  function folio(it) {
    const a = $('a', 'folio'); a.href = '#' + encodeURIComponent(it.id);
    const pic = $('div', 'pic' + (it.type === 'land' ? ' land' : ' portrait') + (it.thumbs ? ' quad' : ''));
    (it.thumbs || [it.thumb]).forEach(s => s && pic.append(img(s, it.show)));
    const t = $('div', 'txt');
    t.append($('h3', '', `${esc(it.show)}<small>${esc(it.hanja)}</small>`), $('div', 'ttl', esc((it.icon ? it.icon + ' ' : '') + it.title)), $('p', '', esc(it.blurb)));
    const f = $('div', 'foot');
    if (it.grade) f.append($('span', sealCls(it.grade), esc(it.grade)));
    (it.people || []).filter(p => !p.group).forEach(p => f.append($('span', 'chip', esc(p.show))));
    f.append($('span', 'more', it.type === 'land' ? '이 땅을 펼쳐 읽기 →' : '펼쳐 읽기 →'));
    t.append(f); a.append(pic, t);
    return a;
  }
  function secHTML(secs, openAll) {
    const box = $('div');
    secs.forEach((s, i) => {
      const d = $('details', 'sec'); if (openAll || i === 0 || OPEN.test(s.t)) d.open = true;
      d.append($('summary', '', esc(s.t || '개요')), $('div', 'in', s.h)); box.append(d);
    });
    return box;
  }
  const reader = document.getElementById('reader'), sheet = document.getElementById('sheet');
  function show(id) {
    const it = byId[id]; if (!it) return close(true);
    sheet.replaceChildren();
    const xw = $('div', 'xwrap'); const x = $('button', 'x', '✕'); x.setAttribute('aria-label', '닫기'); x.onclick = () => close(); xw.append(x); sheet.append(xw);
    if (it.type === 'person') {
      const hero = $('div', 'hero'); const art = $('div', 'art'); art.append(img(it.art || it.thumb, it.show, '', true));
      const info = $('div'); info.append($('h2', 'brush', esc(it.show)), $('div', 'meta', `${esc(it.hanja)} · ${esc(it.title)}`), $('span', sealCls(it.grade), '등급 ' + esc(it.grade)));
      const first = it.secs[0];
      if (first && /기본/.test(first.t)) { const b = $('div', 'in'); b.style.marginTop = '14px'; b.innerHTML = first.h; info.append(b); }
      if (it.link && byId[it.link]) { const n = $('div', 'link-note', `☁️ 그가 거느리는 <a href="#${encodeURIComponent(it.link)}">사방신</a>은 천계 장에 따로 실려 있다.`); info.append(n); }
      hero.append(art, info); sheet.append(hero);
      const body = $('div', 'body'); body.append(secHTML(first && /기본/.test(first.t) ? it.secs.slice(1) : it.secs)); sheet.append(body);
    } else {
      const ban = $('div', 'banner');
      if (it.thumbs) { ban.style.display = 'grid'; ban.style.gridTemplateColumns = 'repeat(4,1fr)'; it.thumbs.forEach(s => ban.append(img(s, ''))); }
      else ban.append(img(it.thumb, it.show, '', true));
      ban.append($('div', 'cap', `<h2 class="brush">${esc(it.show)}</h2><div>${esc(it.hanja)} · ${esc(it.title)}</div>`)); sheet.append(ban);
      const body = $('div', 'body'); body.append(secHTML(it.secs));
      if (it.people?.length) {
        body.append($('div', 'people-h', `<b class="brush">人</b><span>이 땅의 사람들</span>`));
        for (const p of it.people) body.append(person(p));
      }
      sheet.append(body);
    }
    reader.classList.add('open'); document.body.style.overflow = 'hidden'; reader.scrollTop = 0;
  }
  function person(p) {
    const d = $('details', 'person'); if (p.group) d.open = false;
    const s = $('summary'); const face = $('div', 'face');
    if (p.unknown) face.replaceWith();
    const f = p.unknown ? inkFace('face') : face; if (!p.unknown && p.art) f.append(img(p.art, p.show));
    if (p.group) { f.classList.add('ink'); f.innerHTML = '<span class="st brush" style="background:#9d2932;color:#fff8ee;border-color:#9d2932">四方神</span>'; }
    const mid = $('div'); mid.append($('h4', '', `${esc(p.show)}<small>${esc(p.hanja)}</small>`), $('div', 'bl', esc(p.blurb || '')));
    if (p.grade && !p.group) mid.append($('span', sealCls(p.grade), esc(p.grade)));
    s.append(f, mid, $('span', 'tog', '펼쳐 읽기')); d.append(s);
    const b = $('div', 'pbody');
    d.addEventListener('toggle', () => { if (d.open && !b.dataset.done) { b.dataset.done = 1; if (p.art && !p.unknown) { const a = $('div', 'art'); a.append(img(p.art, p.show)); b.append(a); } b.append(secHTML(p.secs, false)); } });
    d.append(b); return d;
  }
  function close(silent) { reader.classList.remove('open'); document.body.style.overflow = ''; if (!silent && location.hash) history.pushState('', document.title, location.pathname + location.search); }
  reader.addEventListener('click', e => { if (e.target === reader) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && reader.classList.contains('open')) close(); });
  const route = () => { const id = decodeURIComponent(location.hash.slice(1)); if (id && byId[id]) show(id); else close(true); };
  window.addEventListener('hashchange', route);

  // sealed secrets
  const sealed = $('section', 'sealed'); sealed.id = 'sealed';
  sealed.append($('h2', 'brush', '封印'), $('p', '', '플레이 후에 여시오. 한 번 누르면 경고, 한 번 더 누르면 부적이 찢어집니다.'));
  const grid = $('div', 'secrets');
  DATA.secrets.forEach((s, i) => {
    const d = $('div', 'secret'); d.tabIndex = 0;
    d.append($('div', 'who', '封印 其' + ['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五'][i]), $('h3', '', esc(s.who)));
    const tx = $('div', 'text'); tx.append(secHTML(s.secs, true)); d.append(tx);
    d.append($('div', 'fu a', '<span class="brush">封</span>'), $('div', 'fu b', '<span class="brush">印</span>'), $('div', 'ask', '정말 보시겠소? 스포일러요. 한 번 더 누르면 봉인이 풀립니다.'));
    const act = () => { if (d.classList.contains('open')) return; if (d.classList.contains('asking')) { d.classList.remove('asking'); d.classList.add('open'); } else d.classList.add('asking'); };
    d.addEventListener('click', act); d.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !d.classList.contains('open')) { e.preventDefault(); act(); } });
    grid.append(d);
  });
  sealed.append(grid); main.append(sealed);
  main.append($('footer', '', '🪷 서유기 MVU'));
  route();
})();
</script>
